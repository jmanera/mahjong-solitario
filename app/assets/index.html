<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mahjong</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-bg="verde">
<div id="app">
  <header id="top">
    <div class="brand">
      <button class="btn icon" id="bMenu" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div>
        <h1>Mahjong</h1>
        <div class="sub"><span id="hLayout"></span> · partida nº <span id="hSeed"></span></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTime">0:00</b><span>Tiempo</span></div>
      <div class="stat"><b id="sLeft">0</b><span>Fichas</span></div>
      <div class="stat" id="stMoves"><b id="sMoves">0</b><span>Jugadas</span></div>
      <div class="stat"><b id="sScore">0</b><span>Puntos</span></div>
    </div>
    <nav class="tools">
      <button class="btn" id="bUndo" aria-label="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Deshacer</span></button>
      <button class="btn" id="bRedo" aria-label="Rehacer"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>Rehacer</span></button>
      <button class="btn" id="bHint" aria-label="Pista"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span>Pista</span></button>
      <button class="btn" id="bShuffle" aria-label="Barajar"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span>Barajar</span></button>
      <button class="btn" id="bPause" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span>Pausa</span></button>
      <button class="btn" id="bNew" aria-label="Nueva partida"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg><span>Nueva</span></button>
    </nav>
  </header>
  <main id="stage">
    <canvas id="board"></canvas>
    <canvas id="fx"></canvas>
    <div id="pauseCover"><div><h2>En pausa</h2><button class="btn primary" id="bResume">Continuar</button></div></div>
  </main>
</div>
<div id="modal"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script src="layouts.js"></script>
<script src="engine.js"></script>
<script src="tiles.js"></script>
<script src="app.js"></script>
</body>
</html>
